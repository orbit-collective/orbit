; Raise the CLI built-in server's upload limits above the app-level 5MB
; avatar validation rule (UserController::uploadAvatar). Without this, a
; request over the PHP default (post_max_size=8M, upload_max_filesize=2M)
; is rejected by PHP itself before Laravel boots, surfacing as a raw
; "PHP Request Startup" warning instead of a normal validation error.
upload_max_filesize = 10M
post_max_size = 10M
