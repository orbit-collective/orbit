#-------------------------------------------------------------------------------#
#                Qodana analysis configuration file                             #
#                https://www.jetbrains.com/help/qodana/qodana-yaml.html         #
#-------------------------------------------------------------------------------#
version: "1.0"

linter: qodana-php

php:
  version: "8.5"

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - vendor/
      - node_modules/
      - storage/
      - var/
      - public/build/
      - tests/_output/
  - name: DuplicatedCode
  - name: PhpDynamicAsStaticMethodCallInspection
  - name: JsCoverageInspection
  - name: PhpCoverageInspection
  - name: PhpIncompatibleReturnTypeInspection
  - name: PhpUndefinedMethodInspection
  - name: PhpPossiblePolymorphicInvocationInspection
  - name: PhpUndefinedFieldInspection
  - name: PhpDisabledQualityToolComposerInspection
  - name: PhpParamsInspection
  - name: RegExpRedundantEscape
  - name: RegExpUnnecessaryNonCapturingGroup

include:
  - name: PhpCSFixerValidationInspection
  - name: PhpUnhandledExceptionInspection
  - name: CheckDependencyLicenses

bootstrap: |
  npm install --legacy-peer-deps
  npx vitest run --coverage

# Quality Gate
failureConditions:
  severityThresholds:
    any: 15
    critical: 0
