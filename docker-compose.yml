services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: php

        ports:
            - "8000:8000"

        environment:
            APP_NAME: ${APP_NAME}
            APP_ENV: ${APP_ENV}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG}
            APP_URL: ${APP_URL}
            APP_LOCALE: ${APP_LOCALE}
            APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
            APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
            APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER}

            BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}

            LOG_CHANNEL: ${LOG_CHANNEL}
            LOG_STACK: ${LOG_STACK}
            LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
            LOG_LEVEL: ${LOG_LEVEL}

            DB_CONNECTION: ${DB_CONNECTION}

            SESSION_DRIVER: ${SESSION_DRIVER}
            SESSION_LIFETIME: ${SESSION_LIFETIME}
            SESSION_ENCRYPT: ${SESSION_ENCRYPT}
            SESSION_PATH: ${SESSION_PATH}
            SESSION_DOMAIN: ${SESSION_DOMAIN}

            BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}

            REVERB_APP_ID: ${REVERB_APP_ID:-}
            REVERB_APP_KEY: ${REVERB_APP_KEY:-}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
            # Hardcoded (not ${REVERB_HOST}): the app and queue workers publish to the
            # reverb service over the Docker network, never through localhost.
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_PUBLIC_HOST: ${REVERB_PUBLIC_HOST:-localhost}
            REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-8080}
            REVERB_PUBLIC_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
            REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-}
            LIVE_POLL_INTERVAL: ${LIVE_POLL_INTERVAL:-30}

            FILESYSTEM_DISK: ${FILESYSTEM_DISK}

            QUEUE_CONNECTION: ${QUEUE_CONNECTION}

            CACHE_STORE: ${CACHE_STORE}

            MEMCACHED_HOST: ${MEMCACHED_HOST}

            REDIS_CLIENT: ${REDIS_CLIENT}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_PORT: ${REDIS_PORT}

            MAIL_MAILER: ${MAIL_MAILER}
            MAIL_SCHEME: ${MAIL_SCHEME}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME}

            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
            AWS_BUCKET: ${AWS_BUCKET}
            AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}

            SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}

            NSFW_DETECTION_ENABLED: ${NSFW_DETECTION_ENABLED}
            # Hardcoded (not ${NSFW_SERVICE_URL}): inside the app container, the nsfwjs
            # service is only reachable via its Docker network hostname, never localhost.
            NSFW_SERVICE_URL: http://nsfwjs:3333
            NSFW_THRESHOLD: ${NSFW_THRESHOLD}

            ORBIT_API_URL: ${ORBIT_API_URL:-https://api.orbit-dev.app}

        volumes:
            - .:/app

            # Keep the image-installed dependencies instead of the host's.
            - /app/vendor

            # Read-only Docker API socket for Settings -> Developer Portal (container
            # uptime). The portal itself only runs with APP_ENV=local; remove this line
            # if you do not want the app container to see Docker at all.
            - /var/run/docker.sock:/var/run/docker.sock:ro

        restart: unless-stopped
        tty: true
        stdin_open: true

        depends_on:
            nsfwjs:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - orbit-network

    queue:
        build:
            context: .
            dockerfile: Dockerfile
            target: php

        command: ["php", "artisan", "queue:work", "--queue=live,default", "--tries=3"]

        environment:
            APP_NAME: ${APP_NAME}
            APP_ENV: ${APP_ENV}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG}
            APP_URL: ${APP_URL}
            APP_LOCALE: ${APP_LOCALE}
            APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
            APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
            APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER}

            BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}

            LOG_CHANNEL: ${LOG_CHANNEL}
            LOG_STACK: ${LOG_STACK}
            LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
            LOG_LEVEL: ${LOG_LEVEL}

            DB_CONNECTION: ${DB_CONNECTION}

            SESSION_DRIVER: ${SESSION_DRIVER}
            SESSION_LIFETIME: ${SESSION_LIFETIME}
            SESSION_ENCRYPT: ${SESSION_ENCRYPT}
            SESSION_PATH: ${SESSION_PATH}
            SESSION_DOMAIN: ${SESSION_DOMAIN}

            BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}

            REVERB_APP_ID: ${REVERB_APP_ID:-}
            REVERB_APP_KEY: ${REVERB_APP_KEY:-}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
            # Hardcoded (not ${REVERB_HOST}): the app and queue workers publish to the
            # reverb service over the Docker network, never through localhost.
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_PUBLIC_HOST: ${REVERB_PUBLIC_HOST:-localhost}
            REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-8080}
            REVERB_PUBLIC_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
            REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-}

            FILESYSTEM_DISK: ${FILESYSTEM_DISK}

            QUEUE_CONNECTION: ${QUEUE_CONNECTION}

            CACHE_STORE: ${CACHE_STORE}

            MEMCACHED_HOST: ${MEMCACHED_HOST}

            REDIS_CLIENT: ${REDIS_CLIENT}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_PORT: ${REDIS_PORT}

            MAIL_MAILER: ${MAIL_MAILER}
            MAIL_SCHEME: ${MAIL_SCHEME}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME}

            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
            AWS_BUCKET: ${AWS_BUCKET}
            AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}

            SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}

            NSFW_DETECTION_ENABLED: ${NSFW_DETECTION_ENABLED}
            NSFW_SERVICE_URL: http://nsfwjs:3333
            NSFW_THRESHOLD: ${NSFW_THRESHOLD}

            ORBIT_API_URL: ${ORBIT_API_URL:-https://api.orbit-dev.app}

        volumes:
            - .:/app

            # Keep the image-installed dependencies instead of the host's.
            - /app/vendor

        restart: unless-stopped

        depends_on:
            app:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - orbit-network

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            target: php

        # Runs every registered Schedule::* entry (see routes/console.php)
        # on its own cadence - e.g. PollGithubRelayEvents, once a minute.
        # Without this container nothing ever invokes the scheduler, so no
        # scheduled task in the app runs at all, on any cadence.
        command: ["php", "artisan", "schedule:work"]

        environment:
            APP_NAME: ${APP_NAME}
            APP_ENV: ${APP_ENV}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG}
            APP_URL: ${APP_URL}
            APP_LOCALE: ${APP_LOCALE}
            APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
            APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}
            APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER}

            BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}

            LOG_CHANNEL: ${LOG_CHANNEL}
            LOG_STACK: ${LOG_STACK}
            LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
            LOG_LEVEL: ${LOG_LEVEL}

            DB_CONNECTION: ${DB_CONNECTION}

            SESSION_DRIVER: ${SESSION_DRIVER}
            SESSION_LIFETIME: ${SESSION_LIFETIME}
            SESSION_ENCRYPT: ${SESSION_ENCRYPT}
            SESSION_PATH: ${SESSION_PATH}
            SESSION_DOMAIN: ${SESSION_DOMAIN}

            BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}

            REVERB_APP_ID: ${REVERB_APP_ID:-}
            REVERB_APP_KEY: ${REVERB_APP_KEY:-}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
            # Hardcoded (not ${REVERB_HOST}): the app and queue workers publish to the
            # reverb service over the Docker network, never through localhost.
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_PUBLIC_HOST: ${REVERB_PUBLIC_HOST:-localhost}
            REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-8080}
            REVERB_PUBLIC_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
            REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-}

            FILESYSTEM_DISK: ${FILESYSTEM_DISK}

            QUEUE_CONNECTION: ${QUEUE_CONNECTION}

            CACHE_STORE: ${CACHE_STORE}

            MEMCACHED_HOST: ${MEMCACHED_HOST}

            REDIS_CLIENT: ${REDIS_CLIENT}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_PORT: ${REDIS_PORT}

            MAIL_MAILER: ${MAIL_MAILER}
            MAIL_SCHEME: ${MAIL_SCHEME}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME}

            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
            AWS_BUCKET: ${AWS_BUCKET}
            AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}

            SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}

            NSFW_DETECTION_ENABLED: ${NSFW_DETECTION_ENABLED}
            NSFW_SERVICE_URL: http://nsfwjs:3333
            NSFW_THRESHOLD: ${NSFW_THRESHOLD}

            ORBIT_API_URL: ${ORBIT_API_URL:-https://api.orbit-dev.app}

        volumes:
            - .:/app

            # Keep the image-installed dependencies instead of the host's.
            - /app/vendor

        restart: unless-stopped

        depends_on:
            app:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - orbit-network

    reverb:
        # Laravel Reverb, the WebSocket server behind live updates. Same image as
        # `app`, different command. The app and queue workers publish to it as
        # `reverb:8080` on the internal network; browsers connect to the published
        # port (development) or to a TLS reverse proxy in front of it (production,
        # see documentation/en/live-updates/). Without REVERB_APP_KEY/SECRET/ID the
        # server idles and the app keeps working on periodic reloads.
        build:
            context: .
            dockerfile: Dockerfile
            target: php

        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]

        ports:
            - "${REVERB_PUBLISHED_PORT:-8080}:8080"

        environment:
            APP_NAME: ${APP_NAME}
            APP_ENV: ${APP_ENV}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG}
            APP_URL: ${APP_URL}

            LOG_CHANNEL: ${LOG_CHANNEL}
            LOG_STACK: ${LOG_STACK}
            LOG_LEVEL: ${LOG_LEVEL}

            BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}

            REVERB_APP_ID: ${REVERB_APP_ID:-}
            REVERB_APP_KEY: ${REVERB_APP_KEY:-}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
            REVERB_HOST: reverb
            REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-}
            REVERB_SCALING_ENABLED: ${REVERB_SCALING_ENABLED:-false}
            REVERB_APP_MAX_CONNECTIONS: ${REVERB_APP_MAX_CONNECTIONS:-1000}
            REVERB_APP_RATE_LIMITING_ENABLED: ${REVERB_APP_RATE_LIMITING_ENABLED:-true}

            # Scaling publishes through Redis pub/sub (REVERB_SCALING_ENABLED=true).
            REDIS_CLIENT: ${REDIS_CLIENT}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_PORT: ${REDIS_PORT}

        volumes:
            - .:/app

            # Keep the image-installed dependencies instead of the host's.
            - /app/vendor

        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
            interval: 15s
            timeout: 3s
            retries: 5
            start_period: 10s

        restart: unless-stopped

        depends_on:
            redis:
                condition: service_healthy

        networks:
            - orbit-network

    vite:
        build:
            context: .
            dockerfile: Dockerfile
            target: node

        ports:
            - "5173:5173"

        environment:
            NODE_ENV: development

            APP_URL: ${APP_URL}

            VITE_APP_NAME: ${VITE_APP_NAME}
            VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}

            # File watching and test parallelism (see vite.config.js).
            VITE_WATCH_POLLING: ${VITE_WATCH_POLLING:-true}
            VITE_WATCH_INTERVAL: ${VITE_WATCH_INTERVAL:-1000}
            VITEST_MAX_WORKERS: ${VITEST_MAX_WORKERS:-6}

        volumes:
            - .:/app
            - /app/node_modules

        restart: unless-stopped
        tty: true
        stdin_open: true

        networks:
            - orbit-network

    storybook:
        # Same image as `vite` (the Dockerfile's `node` target), run as its own
        # container so the component workshop never slows or restarts the app.
        # Not part of a plain `docker compose up`; start it with `make storybook`.
        build:
            context: .
            dockerfile: Dockerfile
            target: node

        profiles:
            - storybook

        command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0", "--ci"]

        ports:
            - "6006:6006"

        environment:
            NODE_ENV: development

            # Docker bind mounts do not deliver file events reliably.
            STORYBOOK_USE_POLLING: "true"
            STORYBOOK_DISABLE_TELEMETRY: "1"

        volumes:
            - .:/app
            - /app/node_modules

        restart: unless-stopped
        tty: true
        stdin_open: true

    redis:
        # Cache, sessions and queues (CACHE_STORE / SESSION_DRIVER /
        # QUEUE_CONNECTION=redis). Only reachable inside the Docker network as
        # `redis` (set REDIS_HOST=redis), so no port is published.
        image: redis:7-alpine

        # AOF keeps queued jobs and sessions across restarts. volatile-lru only
        # ever evicts keys that have a TTL (cache entries, sessions), never the
        # queue lists, so a full cache cannot lose jobs. REDIS_PASSWORD is
        # optional: unset, empty or `null` means no password.
        command:
            - sh
            - -c
            - |
              if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
                  set -- --requirepass "$$REDIS_PASSWORD"
              else
                  set --
              fi
              exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru "$$@"

        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}

        volumes:
            - redis-data:/data

        healthcheck:
            test:
                - CMD-SHELL
                - |
                  p="$$REDIS_PASSWORD"; [ "$$p" = "null" ] && p=""
                  if [ -n "$$p" ]; then REDISCLI_AUTH="$$p" redis-cli ping; else redis-cli ping; fi | grep -q PONG
            interval: 10s
            timeout: 3s
            retries: 5
            # Probe every second while starting so the services that wait for
            # a healthy redis do not sit through a whole 10 s interval first.
            start_period: 10s
            start_interval: 1s

        restart: unless-stopped

        networks:
            - orbit-network

    nsfwjs:
        image: andresribeiroo/nsfwjs
        restart: unless-stopped
        ports:
            - "3333:3333"

        networks:
            - orbit-network

    backup:
        build:
            context: ./docker/backup

        # Starts as root only to chown the mounted directory, then runs as the
        # owner of database/database.sqlite so it can always read it and the
        # snapshots in ./backup belong to you. Set BACKUP_UID and BACKUP_GID to
        # override that.
        environment:
            BACKUP_UID: ${BACKUP_UID:-}
            BACKUP_GID: ${BACKUP_GID:-}
            BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
            BACKUP_KEEP: ${BACKUP_KEEP:-48}
            BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}

        volumes:
            # Read-only: the backup container can never modify the live database.
            - ./database:/data/database:ro

            # Point BACKUP_DIR at another drive to keep snapshots off this disk.
            - ${BACKUP_DIR:-./backup}:/backup

        healthcheck:
            test: ["CMD-SHELL", "find /backup -maxdepth 1 -name 'orbit-*.sqlite' -mmin -$$((2 * ${BACKUP_INTERVAL:-3600} / 60 + 1)) | grep -q ."]
            interval: 5m
            start_period: 2m

        restart: unless-stopped

        networks:
            - orbit-network

    uptime-kuma:
        image: louislam/uptime-kuma:2
        profiles:
            - monitoring

        ports:
            - "3001:3001"

        volumes:
            - uptime-kuma-data:/app/data

        restart: unless-stopped

        networks:
            - orbit-network

networks:
    orbit-network:
        driver: bridge

volumes:
    redis-data:
    uptime-kuma-data:
