name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx oxlint resources/js
      - run: npx oxfmt --check resources/js

  test-js:
    name: Component tests (Vitest)
    runs-on: ubuntu-latest
    env:
      LARAVEL_BYPASS_ENV_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Enforces the coverage thresholds configured in vite.config.js
      # (statements/functions/lines 80%, branches 75%) as a merge gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    env:
      LARAVEL_BYPASS_ENV_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Every story renders and passes its play function (portable stories).
      - run: npm run test:stories
      # The static build is what would be published, so it must compile.
      - run: npm run build-storybook

  test-php:
    name: PHP tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      # The feature tests render Inertia pages, and the Vite helper needs either
      # a build manifest or a `hot` file to emit its asset tags. They only look
      # at the HTML, so a `hot` file is enough: it saves `npm ci` and a full
      # frontend build here (the Build verification job still builds for real).
      - run: echo 'http://localhost:5173' > public/hot
      # `test-coverage` runs the full Pest suite in parallel (paratest, one
      # process per core) and fails the build if line coverage of `app/` drops
      # below the threshold in composer.json (see the "test-coverage" script,
      # currently a 90% floor with real coverage at 96% as of this writing).
      # It calls `vendor/bin/pest` rather than `php artisan test`, because
      # `artisan test --parallel` silently skips coverage and its `--min`.
      - run: composer test-coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-report
          path: coverage-html/
          retention-days: 14

  ci-status:
    name: CI status
    if: always()
    needs: [typecheck, lint, test-js, storybook, build, test-php]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
