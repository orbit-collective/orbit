name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint resources/js

  test-js:
    name: Component tests (Vitest)
    runs-on: ubuntu-latest
    env:
      LARAVEL_BYPASS_ENV_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Enforces the coverage thresholds configured in vite.config.js
      # (statements/functions/lines 80%, branches 75%) as a merge gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  test-php:
    name: PHP tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      # `test-coverage` runs the full Pest suite and fails the build if line
      # coverage of `app/` drops below the threshold in composer.json (see
      # the "test-coverage" script, currently a 90% floor with real coverage
      # at 100% as of this writing — a comfortable regression buffer).
      - run: composer test-coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-report
          path: coverage-html/
          retention-days: 14

  ci-status:
    name: CI status
    if: always()
    needs: [typecheck, lint, test-js, build, test-php]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
